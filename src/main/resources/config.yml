# Limites de níveis para encantamentos Vanilla
vanilla_overrides:
  efficiency: 10
  fortune: 10
  sharpness: 10
  protection: 10
  unbreaking: 10

# Tiers e Cores
tiers:
  COMUM: "&f"
  INCOMUM: "&7"
  RARO: "&b"
  ÉPICO: "&5"
  LENDÁRIO: "&6"
  MÍTICO: "&d"
  DIVINO: "&e&l"
  DEMONÍACO: "&4&l"
